# No "Functions:" block here on purpose. Playnite 10.35 ignores that key for
# script extensions - a deliberately malformed value loads without any error,
# so it produces no main-menu entries. The extension is driven entirely by the
# OnApplicationStarted and OnLibraryUpdated events instead, which means
# "Update Game Library" (F5) doubles as the manual re-scan.
